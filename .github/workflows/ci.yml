name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  test-db:
    runs-on: ubuntu-latest
    services:
      # Isolated disposable database; every run gets a fresh container.
      database:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: beans_beats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beans_beats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable-test-password@localhost:5432/beans_beats_test
      TEST_DB_IS_DISPOSABLE: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Supabase-compatible roles and auth schema before the migrations.
      - name: Bootstrap disposable database
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/bootstrap-test-db.sql
      # Fails the job on the first SQL assertion failure or if tests are skipped.
      - run: npm run test:db
