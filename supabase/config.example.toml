# Copy to config.toml for an isolated local test database.
project_id = "beans-beats-qms"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

# Optional phone testing: enable only after creating a certificate that includes
# this computer's Wi-Fi address. Certificate files remain outside version control.
[api.tls]
enabled = false
# cert_path = "../certificates/localhost.pem"
# key_path = "../certificates/localhost-key.pem"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
sql_paths = ["./insert_mock_data.sql"]

[studio]
enabled = false

[analytics]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[local_smtp]
enabled = false
